repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck scripts/*.sh
        language: system
        pass_filenames: false
